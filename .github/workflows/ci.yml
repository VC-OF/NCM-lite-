name: NCM-Lite CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: PyTest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install PyTorch CPU and Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
          python -m pip install pytest pyyaml tqdm

      - name: Run PyTest Test Suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -v tests

      - name: Run End-to-End Pipeline Smoke Test
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_smoke_pipeline.py
